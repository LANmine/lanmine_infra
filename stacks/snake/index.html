<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANmine Snake</title>
<style>
  :root{ --bg:#05060a; --fg:#e6faff; --accent:#22e6c8; --accent2:#7c5cff; --dim:#5a6b78; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Monaspace Neon",ui-monospace,Menlo,Consolas,monospace;
    background:radial-gradient(1200px 800px at 50% -10%,#0d1930 0%,var(--bg) 60%);
    color:var(--fg); min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    text-align:center; padding:16px;
  }
  h1{
    font-size:clamp(1.8rem,6vw,3rem); font-weight:800; letter-spacing:.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(34,230,200,.25);
  }
  .hud{display:flex; gap:2em; color:var(--dim); letter-spacing:.2em; font-size:.9rem; text-transform:uppercase}
  .hud b{color:var(--fg)}
  canvas{
    background:#080b12; border:1px solid rgba(124,92,255,.35); border-radius:10px;
    box-shadow:0 0 40px rgba(34,230,200,.12); touch-action:none; max-width:92vw; height:auto;
  }
  .hint{color:var(--dim); font-size:.8rem; letter-spacing:.1em}
  .over{color:var(--accent2); font-weight:700; letter-spacing:.2em; min-height:1.2em}
</style>
</head>
<body>
  <h1>LANmine Snake</h1>
  <div class="hud">Score <b id="score">0</b> &nbsp; Best <b id="best">0</b></div>
  <canvas id="game" width="420" height="420"></canvas>
  <div class="over" id="over"></div>
  <div class="hint">Arrow keys / WASD to move &middot; Space to (re)start</div>
<script>
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const N = 21, CELL = cv.width / N;
  const scoreEl = document.getElementById("score"), bestEl = document.getElementById("best"), overEl = document.getElementById("over");
  let best = +(localStorage.getItem("lanmine_snake_best") || 0); bestEl.textContent = best;

  let snake, dir, nextDir, food, score, alive, timer;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = dir;
    score = 0; scoreEl.textContent = 0; alive = true; overEl.textContent = "";
    placeFood();
    clearInterval(timer); timer = setInterval(tick, 90);
  }
  function placeFood(){
    do { food = {x:(Math.random()*N)|0, y:(Math.random()*N)|0}; }
    while (snake.some(s => s.x===food.x && s.y===food.y));
  }
  function tick(){
    dir = nextDir;
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if (head.x<0||head.y<0||head.x>=N||head.y>=N || snake.some(s=>s.x===head.x&&s.y===head.y)){
      alive = false; clearInterval(timer);
      overEl.textContent = ">> GAME OVER — SPACE TO RESTART <<";
      if (score>best){ best=score; localStorage.setItem("lanmine_snake_best",best); bestEl.textContent=best; }
      return;
    }
    snake.unshift(head);
    if (head.x===food.x && head.y===food.y){ score++; scoreEl.textContent=score; placeFood(); }
    else snake.pop();
    draw();
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    // food
    ctx.fillStyle = "#7c5cff";
    ctx.fillRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4);
    // snake
    snake.forEach((s,i)=>{
      ctx.fillStyle = i===0 ? "#22e6c8" : "rgba(34,230,200,"+(0.85-i/snake.length*0.6)+")";
      ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
    });
  }
  function turn(x,y){ if (dir.x!==-x && dir.y!==-y) nextDir={x,y}; }
  addEventListener("keydown", e=>{
    const k=e.key.toLowerCase();
    if (k==="arrowup"||k==="w") turn(0,-1);
    else if (k==="arrowdown"||k==="s") turn(0,1);
    else if (k==="arrowleft"||k==="a") turn(-1,0);
    else if (k==="arrowright"||k==="d") turn(1,0);
    else if (k===" "){ if(!alive) reset(); }
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
  });
  // basic swipe for touch
  let tx,ty;
  cv.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  cv.addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1);
  });
  reset();
</script>
</body>
</html>
