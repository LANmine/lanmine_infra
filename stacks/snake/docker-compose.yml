services:
  # Bind mounts are disabled, so an init container pulls index.html from the repo
  # into a named volume, then nginx serves it. Edit index.html to change the game.
  content-loader:
    image: curlimages/curl:latest
    restart: "no"
    security_opt:
      - no-new-privileges:true
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        curl -sSf -H 'Accept: application/vnd.github.raw' 'https://api.github.com/repos/LANmine/lanmine_infra/contents/stacks/snake/index.html?ref=main' -o /usr/share/nginx/html/index.html
    volumes:
      - site:/usr/share/nginx/html

  snake:
    image: nginxinc/nginx-unprivileged:alpine@sha256:aa8c9087d36d93e9d650c5365f883b421e8214aedbad24ade52b844c583358f1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      content-loader:
        condition: service_completed_successfully
    volumes:
      - site:/usr/share/nginx/html
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.snake.rule=Host(`snake.tech.lanmine.no`)
      - traefik.http.routers.snake.service=snake
      - traefik.http.services.snake.loadbalancer.server.port=8080

volumes:
  site:

networks:
  traefik:
    external: true
