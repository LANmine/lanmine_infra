services:
  # Browser DOOM (shareware) compiled to WebAssembly — runs client-side, keyboard only.
  # Prebuilt public image, pinned by digest so deploys are reproducible.
  # The image serves static files with `python3 -m http.server 8000`.
  # NB: the ghcr.io/trisnol build aborts with a WASM "alignment fault" at startup
  # (black screen); this elliottking build of the same project reaches "game started"
  # and runs the main loop, so use it instead.
  doom:
    image: elliottking/doom-wasm:0.1.1@sha256:e556cde9c244f7806a3ebb110c04ab124a974c1293524650d12b082d48303593
    restart: unless-stopped
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.doom.rule=Host(`doom.tech.lanmine.no`)
      - traefik.http.routers.doom.service=doom
      - traefik.http.services.doom.loadbalancer.server.port=8000

networks:
  traefik:
    external: true
