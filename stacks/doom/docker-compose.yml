services:
  # Browser DOOM via js-dos (real DOS binary in the DOSBox emulator) — keyboard only.
  # Bind mounts are disabled, so an init container pulls index.html from the repo
  # into a named volume, then nginx serves it. Edit index.html to change the page.
  # (The js-dos runtime + the DOOM shareware bundle load from the js-dos CDN.)
  content-loader:
    image: curlimages/curl:latest
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        curl -sSf -H 'Accept: application/vnd.github.raw' 'https://api.github.com/repos/LANmine/lanmine_infra/contents/stacks/doom/index.html?ref=main' -o /usr/share/nginx/html/index.html
    volumes:
      - site:/usr/share/nginx/html

  doom:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      content-loader:
        condition: service_completed_successfully
    volumes:
      - site:/usr/share/nginx/html
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.doom.rule=Host(`doom.tech.lanmine.no`)
      - traefik.http.routers.doom.service=doom
      - traefik.http.services.doom.loadbalancer.server.port=80

volumes:
  site:

networks:
  traefik:
    external: true
