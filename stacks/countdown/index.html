<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANmine 42 — Countdown</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Alegreya+Sans:wght@700;800&display=swap">
<style>
  :root{
    --bg:#282828; --panel:#465c69; --accent:#ee982b; --fg:#efefef; --dim:#9aa3a8;
    --body:'Poppins', sans-serif; --disp:'Alegreya Sans','Poppins',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--body);
    background:radial-gradient(1200px 800px at 50% -10%, #33383b 0%, var(--bg) 62%);
    color:var(--fg); min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; overflow:hidden; position:relative;
  }
  /* subtle moving grid (brand-tinted) */
  body::before{
    content:""; position:fixed; inset:-50%;
    background-image:linear-gradient(rgba(238,152,43,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(70,92,105,.12) 1px,transparent 1px);
    background-size:44px 44px;
    transform:perspective(500px) rotateX(60deg);
    animation:drift 12s linear infinite; z-index:0;
  }
  @keyframes drift{from{background-position:0 0}to{background-position:0 44px}}
  @media (prefers-reduced-motion:reduce){ body::before{animation:none} }

  .wrap{position:relative; z-index:1; padding:24px}
  .kicker{font-weight:600; letter-spacing:.42em; color:var(--accent); font-size:clamp(.7rem,2vw,1rem); text-transform:uppercase}
  h1{
    font-family:var(--disp); font-weight:800; text-transform:uppercase;
    font-size:clamp(2.8rem,12vw,9rem); line-height:.92; margin:.14em 0 .12em; letter-spacing:.01em; color:#fff;
  }
  .dates{color:var(--fg); opacity:.85; font-size:clamp(.9rem,3vw,1.35rem); margin-bottom:1.5em}
  .timer{display:flex; gap:clamp(10px,3vw,40px); justify-content:center; flex-wrap:wrap}
  .cell{min-width:clamp(64px,18vw,150px)}
  .num{
    font-family:var(--disp); font-weight:800; font-variant-numeric:tabular-nums;
    font-size:clamp(2.6rem,13vw,7.5rem); line-height:1; color:var(--fg);
  }
  .lbl{margin-top:.55em; letter-spacing:.34em; color:var(--dim); font-size:clamp(.6rem,2vw,.9rem); text-transform:uppercase; font-weight:500}
  .live{margin-top:2em; color:var(--accent); letter-spacing:.3em; font-size:clamp(1rem,4vw,2rem); display:none; font-weight:700; text-transform:uppercase; font-family:var(--disp)}
  .foot{position:fixed; bottom:14px; width:100%; color:var(--dim); font-size:.75rem; letter-spacing:.2em; z-index:1}
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Esports LAN Gaming</div>
    <h1>LANmine&nbsp;42</h1>
    <div class="dates">1&ndash;4 October 2026 &middot; Hvalerhallen</div>
    <div class="timer" id="timer">
      <div class="cell"><div class="num" id="d">--</div><div class="lbl">days</div></div>
      <div class="cell"><div class="num" id="h">--</div><div class="lbl">hours</div></div>
      <div class="cell"><div class="num" id="m">--</div><div class="lbl">minutes</div></div>
      <div class="cell"><div class="num" id="s">--</div><div class="lbl">seconds</div></div>
    </div>
    <div class="live" id="live">It's LANmine time</div>
  </div>
<script>
  // Target: LANmine 42 doors open — Thu 1 October 2026, 14:00 (CEST = UTC+2). Edit to adjust.
  const TARGET = new Date("2026-10-01T14:00:00+02:00").getTime();
  const pad = n => String(n).padStart(2,"0");
  function tick(){
    const diff = TARGET - Date.now();
    if(diff <= 0){
      document.getElementById("timer").style.display="none";
      document.getElementById("live").style.display="block";
      return;
    }
    const s=Math.floor(diff/1000);
    document.getElementById("d").textContent = Math.floor(s/86400);
    document.getElementById("h").textContent = pad(Math.floor(s%86400/3600));
    document.getElementById("m").textContent = pad(Math.floor(s%3600/60));
    document.getElementById("s").textContent = pad(s%60);
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
