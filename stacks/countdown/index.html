<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANmine 42 — Countdown</title>
<style>
  :root{
    --bg:#05060a; --fg:#e6faff; --accent:#22e6c8; --accent2:#7c5cff; --dim:#5a6b78;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Monaspace Neon",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    background:radial-gradient(1200px 800px at 50% -10%,#0d1930 0%,var(--bg) 60%);
    color:var(--fg); min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; overflow:hidden; position:relative;
  }
  /* subtle moving grid */
  body::before{
    content:""; position:fixed; inset:-50%;
    background-image:linear-gradient(rgba(34,230,200,.06) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(124,92,255,.06) 1px,transparent 1px);
    background-size:44px 44px;
    transform:perspective(500px) rotateX(60deg) translateY(0);
    animation:drift 12s linear infinite; z-index:0;
  }
  @keyframes drift{from{background-position:0 0}to{background-position:0 44px}}
  .wrap{position:relative; z-index:1; padding:24px}
  .kicker{letter-spacing:.5em; color:var(--dim); font-size:clamp(.7rem,2vw,1rem); text-transform:uppercase}
  h1{
    font-size:clamp(2.6rem,11vw,8rem); line-height:.95; margin:.15em 0 .1em;
    font-weight:800; letter-spacing:.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(34,230,200,.25);
  }
  .dates{color:var(--fg); opacity:.8; font-size:clamp(.9rem,3vw,1.4rem); margin-bottom:1.4em}
  .timer{display:flex; gap:clamp(10px,3vw,36px); justify-content:center; flex-wrap:wrap}
  .cell{min-width:clamp(64px,18vw,150px)}
  .num{
    font-size:clamp(2.4rem,12vw,7rem); font-weight:800; font-variant-numeric:tabular-nums;
    color:var(--fg); text-shadow:0 0 24px rgba(124,92,255,.35);
  }
  .lbl{margin-top:.4em; letter-spacing:.35em; color:var(--dim); font-size:clamp(.6rem,2vw,.9rem); text-transform:uppercase}
  .live{margin-top:2em; color:var(--accent); letter-spacing:.3em; font-size:clamp(1rem,4vw,2rem); display:none}
  .foot{position:fixed; bottom:14px; width:100%; color:var(--dim); font-size:.75rem; letter-spacing:.2em; z-index:1}
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">esports lan gaming</div>
    <h1>LANmine&nbsp;42</h1>
    <div class="dates">1&ndash;4 October 2026 &middot; Oslo</div>
    <div class="timer" id="timer">
      <div class="cell"><div class="num" id="d">--</div><div class="lbl">days</div></div>
      <div class="cell"><div class="num" id="h">--</div><div class="lbl">hours</div></div>
      <div class="cell"><div class="num" id="m">--</div><div class="lbl">minutes</div></div>
      <div class="cell"><div class="num" id="s">--</div><div class="lbl">seconds</div></div>
    </div>
    <div class="live" id="live">&gt;&gt; IT'S LANMINE TIME &lt;&lt;</div>
  </div>
  <div class="foot">see you at 13:37</div>
<script>
  // Target: LANmine 42 — 1 October 2026, 00:00 (Oslo, CEST = UTC+2). Edit to adjust.
  const TARGET = new Date("2026-10-01T00:00:00+02:00").getTime();
  const pad = n => String(n).padStart(2,"0");
  function tick(){
    const diff = TARGET - Date.now();
    if(diff <= 0){
      document.getElementById("timer").style.display="none";
      document.getElementById("live").style.display="block";
      return;
    }
    const s=Math.floor(diff/1000);
    document.getElementById("d").textContent = Math.floor(s/86400);
    document.getElementById("h").textContent = pad(Math.floor(s%86400/3600));
    document.getElementById("m").textContent = pad(Math.floor(s%3600/60));
    document.getElementById("s").textContent = pad(s%60);
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
