services:
  # v86 — x86 PC emulator (WASM) booting FreeDOS in the browser. Bind mounts are
  # disabled, so an init container pulls the page + disk image from the repo into a
  # named volume; nginx serves them. The v86 runtime/BIOS load from the jsdelivr CDN.
  content-loader:
    image: curlimages/curl:latest
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /usr/share/nginx/html
        curl -sSf -H 'Accept: application/vnd.github.raw' 'https://api.github.com/repos/LANmine/lanmine_infra/contents/stacks/v86/index.html?ref=main' -o /usr/share/nginx/html/index.html
        curl -sSf -H 'Accept: application/vnd.github.raw' 'https://api.github.com/repos/LANmine/lanmine_infra/contents/stacks/v86/freedos722.img?ref=main' -o /usr/share/nginx/html/freedos722.img
    volumes:
      - site:/usr/share/nginx/html

  v86:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      content-loader:
        condition: service_completed_successfully
    volumes:
      - site:/usr/share/nginx/html
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.v86.rule=Host(`v86.tech.lanmine.no`)
      - traefik.http.routers.v86.service=v86
      - traefik.http.services.v86.loadbalancer.server.port=80

volumes:
  site:

networks:
  traefik:
    external: true
