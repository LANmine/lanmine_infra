<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>v86 · LANmine</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #screen_container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* Text console: scale with the viewport so the 80x25 screen fills the page. */
  #screen_container > div { white-space: pre; font-family: 'Courier New', monospace;
    font-size: 1.9vw; line-height: 2.15vw; color: #33ff66; }
  /* Graphics mode: upscale to the viewport height, crisp pixels. */
  #screen_container > canvas { image-rendering: pixelated; height: 96vh; width: auto; max-width: 100vw; }
  #boot { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 2;
    color: #9aa3a8; font-family: ui-monospace, monospace; font-size: 13px; letter-spacing: .15em; }
</style>
</head>
<body>
  <div id="boot">booting…</div>
  <div id="screen_container">
    <div></div>
    <canvas></canvas>
  </div>
<script src="libv86.js"></script>
<script>
  // Self-hosted, matched v86 runtime + FreeDOS image (all same-origin).
  var emu = new V86({
    screen_container: document.getElementById("screen_container"),
    bios: { url: "seabios.bin" },
    vga_bios: { url: "vgabios.bin" },
    wasm_path: "v86.wasm",
    cdrom: { url: "linux.iso" },
    memory_size: 128 * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,
    autostart: true,
  });
  emu.add_listener("emulator-ready", function () {
    var b = document.getElementById("boot"); if (b) b.remove();
  });
</script>
</body>
</html>
