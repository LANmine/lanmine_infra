<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>butterchurn</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  #viz{display:block;width:100vw;height:100vh;background:#000}
  #hint,#toast{
    position:fixed; z-index:9; pointer-events:none;
    font-family:ui-monospace,"Courier New",monospace; font-size:10px; letter-spacing:.22em;
    text-transform:uppercase; color:#e6e6e2; background:rgba(0,0,0,.4); padding:6px 10px;
    transition:opacity .6s ease;
  }
  #hint{ left:50%; bottom:16px; transform:translateX(-50%); opacity:.85 }
  #toast{ left:18px; bottom:16px; opacity:0 }
</style>
</head>
<body>
  <canvas id="viz"></canvas>
  <div id="toast"></div>
  <div id="hint">space next &nbsp;·&nbsp; f fullscreen &nbsp;·&nbsp; d desktop audio &nbsp;·&nbsp; m mic</div>

<script src="./butterchurn.min.js"></script>
<script src="./butterchurnPresets.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById('viz');
  const toast = document.getElementById('toast');
  const hint = document.getElementById('hint');
  const B = (window.butterchurn && (window.butterchurn.default || window.butterchurn));
  const P = (window.butterchurnPresets && (window.butterchurnPresets.default || window.butterchurnPresets));
  let ctx, visualizer, presetKeys = [], idx = 0, toastTimer, ambientMix, ambientBeat;

  function showToast(name){
    toast.textContent = name; toast.style.opacity = '1';
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>toast.style.opacity='0', 3500);
  }
  function sizeTo(){
    canvas.width = innerWidth; canvas.height = innerHeight;
    if (visualizer) visualizer.setRendererSize(innerWidth, innerHeight);
  }
  function loadPreset(i, blend){
    idx = (i + presetKeys.length) % presetKeys.length;
    visualizer.loadPreset(P.getPresets()[presetKeys[idx]], blend === undefined ? 2.7 : blend);
    showToast(presetKeys[idx]);
  }
  function goFullscreen(){ if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); }

  // self-contained generative signal — drives the visuals, makes no sound (muted gain keeps the graph alive)
  function buildAmbient(){
    ambientMix = ctx.createGain(); ambientMix.gain.value = 0.9;
    const mute = ctx.createGain(); mute.gain.value = 0; ambientMix.connect(mute); mute.connect(ctx.destination);
    const kick = ctx.createOscillator(); kick.type='sine'; kick.frequency.value=55;
    const kickG = ctx.createGain(); kickG.gain.value=0.0001; kick.connect(kickG).connect(ambientMix); kick.start();
    const mid = ctx.createOscillator(); mid.type='sawtooth'; mid.frequency.value=220;
    const midG = ctx.createGain(); midG.gain.value=0.15; mid.connect(midG).connect(ambientMix); mid.start();
    const fL = ctx.createOscillator(); fL.type='sine'; fL.frequency.value=0.06; const fLG=ctx.createGain(); fLG.gain.value=170; fL.connect(fLG).connect(mid.frequency); fL.start();
    const aL = ctx.createOscillator(); aL.type='sine'; aL.frequency.value=0.35; const aLG=ctx.createGain(); aLG.gain.value=0.12; aL.connect(aLG).connect(midG.gain); aL.start();
    const nb = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate); const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    const noise = ctx.createBufferSource(); noise.buffer=nb; noise.loop=true;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=0.6;
    const nG = ctx.createGain(); nG.gain.value=0.05; noise.connect(bp).connect(nG).connect(ambientMix); noise.start();
    const beat = ()=>{ const t=ctx.currentTime; kickG.gain.cancelScheduledValues(t); kickG.gain.setValueAtTime(0.0001,t); kickG.gain.exponentialRampToValueAtTime(0.9,t+0.02); kickG.gain.exponentialRampToValueAtTime(0.0001,t+0.30); };
    ambientBeat = setInterval(beat, 500); beat();
    return ambientMix;
  }
  function silenceAmbient(){
    if (ambientBeat){ clearInterval(ambientBeat); ambientBeat = null; }
    if (ambientMix){ try{ ambientMix.gain.setTargetAtTime(0, ctx.currentTime, 0.1); }catch(e){} }
  }

  // optional live audio (keyboard: D / M) — needs the keypress as the user gesture
  async function useDesktop(){
    const s = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true, systemAudio:'include', selfBrowserSurface:'include' });
    s.getVideoTracks().forEach(t=>t.stop());
    if (!s.getAudioTracks().length){ showToast('no audio shared'); return; }
    silenceAmbient(); visualizer.connectAudio(ctx.createMediaStreamSource(s)); showToast('desktop audio');
  }
  async function useMic(){
    const s = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
    silenceAmbient(); visualizer.connectAudio(ctx.createMediaStreamSource(s)); showToast('microphone');
  }

  function init(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    visualizer = B.createVisualizer(ctx, canvas, { width: innerWidth, height: innerHeight, pixelRatio: devicePixelRatio||1, textureRatio: 1 });
    sizeTo();
    visualizer.connectAudio(buildAmbient());
    presetKeys = Object.keys(P.getPresets());
    loadPreset(Math.floor(Math.random()*presetKeys.length), 0);
    setInterval(()=>loadPreset(Math.floor(Math.random()*presetKeys.length), 5.7), 16000);
    (function render(){ requestAnimationFrame(render); visualizer.render(); })();
    // AudioContext starts suspended without a gesture; resume on the first interaction so the beat kicks in
    ctx.resume().catch(()=>{});
    const resume = ()=>ctx.resume().catch(()=>{});
    ['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e, resume, { once:true }));
    // fade the hint out
    setTimeout(()=>{ hint.style.opacity = '0'; }, 6000);
  }

  addEventListener('resize', sizeTo);
  addEventListener('keydown', e=>{
    if (!visualizer) return;
    if (e.code === 'Space'){ e.preventDefault(); loadPreset(idx+1, 2.7); }
    else if (e.key === 'f' || e.key === 'F'){ if (document.fullscreenElement) document.exitFullscreen(); else goFullscreen(); }
    else if (e.key === 'd' || e.key === 'D'){ useDesktop().catch(err=>showToast('desktop audio failed')); }
    else if (e.key === 'm' || e.key === 'M'){ useMic().catch(err=>showToast('mic failed')); }
  });

  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
