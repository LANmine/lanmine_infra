services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - data:/app/data          # keeps the admin account + monitors across redeploys
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.uptimekuma.rule=Host(`uk.tech.lanmine.no`)
      - traefik.http.routers.uptimekuma.service=uptimekuma
      - traefik.http.services.uptimekuma.loadbalancer.server.port=3001

volumes:
  data:

networks:
  traefik:
    external: true
