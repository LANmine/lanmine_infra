# Glance dashboard config — this file IS the dashboard.
# Add widgets or links by editing this file and opening a Pull Request.
# Full reference: https://github.com/glanceapp/glance/blob/main/docs/configuration.md

server:
  assets-path: /app/config/assets

theme:
  # lanmine.no brand: cool-dark base, single orange accent (#EE982B).
  background-color: 205 12 12
  primary-color: 34 85 55
  positive-color: 130 42 52
  negative-color: 0 70 60
  contrast-multiplier: 1.15
  custom-css-file: /assets/custom.css

document:
  head: |
    <script src="/assets/custom.js" defer></script>

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezone: Europe/Oslo

          - type: weather
            location: Hvaler, Norway
            units: metric

          # Reads the checks Gatus already runs, so stacks/gatus/config.yaml stays
          # the single place a service is added. pageSize=1 trims each endpoint to
          # its most recent result, which makes results.0 the current state.
          - type: custom-api
            title: Service status
            cache: 30s
            url: https://status.tech.lanmine.no/api/v1/endpoints/statuses?page=1&pageSize=1
            template: |
              {{ range .JSON.Array "" }}
              <div style="display:flex;justify-content:space-between;font-size:.85em;padding:1px 0">
                <span>{{ .String "name" }}</span>
                {{ if .Bool "results.0.success" }}
                <span style="color:#4caf50">up</span>
                {{ else }}
                <span style="color:#e5534b">down</span>
                {{ end }}
              </div>
              {{ end }}

      - size: full
        widgets:
          - type: html
            css-class: lm-countdown
            source: |
              <div class="lm-cd">
                <div class="lm-cd-kicker">Esports LAN Gaming</div>
                <div class="lm-cd-title">LANmine 42</div>
                <div class="lm-cd-dates">1–4 October 2026 · Hvalerhallen</div>
                <div class="lm-cd-timer" id="lm-timer">
                  <div class="lm-cd-cell"><div class="lm-cd-num" id="lm-d">--</div><div class="lm-cd-lbl">days</div></div>
                  <div class="lm-cd-cell"><div class="lm-cd-num" id="lm-h">--</div><div class="lm-cd-lbl">hours</div></div>
                  <div class="lm-cd-cell"><div class="lm-cd-num" id="lm-m">--</div><div class="lm-cd-lbl">minutes</div></div>
                  <div class="lm-cd-cell"><div class="lm-cd-num" id="lm-s">--</div><div class="lm-cd-lbl">seconds</div></div>
                </div>
                <div class="lm-cd-live" id="lm-live" style="display:none">It's LANmine time</div>
              </div>

          - type: monitor
            title: LANmine services
            cache: 1m
            sites:
              - title: Dashboard
                url: https://dash.tech.lanmine.no
              - title: Status page
                url: https://status.tech.lanmine.no
              - title: Countdown
                url: https://countdown.tech.lanmine.no
              - title: IT-Tools
                url: https://tools.tech.lanmine.no
              - title: CyberChef
                url: https://cyber.tech.lanmine.no
              - title: PrivateBin
                url: https://paste.tech.lanmine.no
              - title: Snake
                url: https://snake.tech.lanmine.no
              - title: DOOM
                url: https://doom.tech.lanmine.no
              - title: Arcade
                url: https://arcade.tech.lanmine.no
              - title: Matrix
                url: https://matrix.tech.lanmine.no
              - title: Butterchurn
                url: https://viz.tech.lanmine.no
              - title: v86
                url: https://v86.tech.lanmine.no
              - title: daedalOS
                url: https://daedalos.tech.lanmine.no
              - title: NETPANDAS
                url: https://netpandas.tech.lanmine.no

      - size: small
        widgets:
          - type: bookmarks
            groups:
              # Links only — service health lives in the "LANmine services" widget.
              - title: Links
                links:
                  - title: LANmine site
                    url: https://lanmine.no
                  - title: The event
                    url: https://lanmine.no/lan-event/the-meaning-of-lan/
                  - title: Infra repo
                    url: https://github.com/LANmine/lanmine_infra
