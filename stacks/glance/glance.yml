# Glance dashboard config — this file IS the dashboard.
# Add widgets or links by editing this file and opening a Pull Request.
# Full reference: https://github.com/glanceapp/glance/blob/main/docs/configuration.md

server:
  assets-path: /app/config/assets

theme:
  custom-css-file: /assets/custom.css

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezone: Europe/Oslo

          - type: weather
            location: Hvaler, Norway
            units: metric

          - type: custom-api
            title: Ragnarok
            cache: 30s
            url: http://ragnarok-metrics:8080/summary
            template: |
              {{ if .JSON.String "error" }}
              <p style="color:#e5534b;font-size:.85em">metrics: {{ .JSON.String "error" }}</p>
              {{ else }}
              <div style="display:flex;justify-content:space-between;font-size:.8em;color:#8b98a5;margin-bottom:6px">
                <span>{{ .JSON.Int "totals.count" }} running</span>
                <span>{{ .JSON.Int "host.cpus" }} vCPU</span>
                <span>{{ printf "%.0f" (.JSON.Float "totals.mem_mib") }}/{{ .JSON.Int "host.mem_total_mib" }} MiB</span>
              </div>
              {{ range .JSON.Array "containers" }}
              <div style="display:flex;justify-content:space-between;font-size:.85em;padding:1px 0">
                <span>{{ .String "name" }}</span>
                <span style="color:#8b98a5">{{ printf "%.1f" (.Float "mem_mib") }} MiB · {{ printf "%.1f" (.Float "cpu") }}%</span>
              </div>
              {{ end }}
              {{ end }}

      - size: full
        widgets:
          - type: iframe
            title: Countdown
            source: https://countdown.tech.lanmine.no
            height: 360

          - type: monitor
            title: LANmine services
            cache: 1m
            sites:
              - title: Dashboard
                url: https://dash.tech.lanmine.no
              - title: Status page
                url: https://status.tech.lanmine.no
              - title: Countdown
                url: https://countdown.tech.lanmine.no
              - title: IT-Tools
                url: https://tools.tech.lanmine.no
              - title: PrivateBin
                url: https://paste.tech.lanmine.no
              - title: Snake
                url: https://snake.tech.lanmine.no
              - title: DOOM
                url: https://doom.tech.lanmine.no
              - title: Arcade
                url: https://arcade.tech.lanmine.no
              - title: Matrix
                url: https://matrix.tech.lanmine.no
              - title: Butterchurn
                url: https://viz.tech.lanmine.no
              - title: Example
                url: https://example.tech.lanmine.no

      - size: small
        widgets:
          - type: bookmarks
            groups:
              # Links only — service health lives in the "LANmine services" widget.
              - title: Links
                links:
                  - title: LANmine site
                    url: https://lanmine.no
                  - title: The event
                    url: https://lanmine.no/lan-event/the-meaning-of-lan/
                  - title: Infra repo
                    url: https://github.com/LANmine/lanmine_infra
