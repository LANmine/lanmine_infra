<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LANmine // Arcade</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Alegreya+Sans:wght@700;800&display=swap">
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<style>
  :root{
    --bg:#282828; --card:#20232a; --panel:#465c69; --accent:#ee982b; --fg:#efefef; --dim:#9aa3a8;
    --body:'Poppins', sans-serif; --disp:'Alegreya Sans','Poppins',sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  html,body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--fg);font-family:var(--body)}
  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 600px at 50% -10%, #313a40 0%, transparent 60%),
      var(--bg);
    background-attachment:fixed; background-repeat:no-repeat; overflow-x:hidden;
  }

  /* CRT overlay: scanlines + vignette (kept subtle for the arcade feel) */
  .crt::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
    mix-blend-mode:multiply;
  }
  .crt::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:51;
    background:radial-gradient(120% 120% at 50% 50%, transparent 60%, rgba(0,0,0,.45) 100%);
  }

  header{ text-align:center; padding:60px 16px 22px; }
  h1{
    font-family:var(--disp); font-weight:800; text-transform:uppercase;
    font-size:clamp(30px,7vw,60px); margin:0; letter-spacing:.02em; line-height:1; color:#fff;
  }
  h1 .b{ color:var(--accent); }
  .coin{ margin-top:18px; font-size:clamp(10px,1.6vw,13px); font-weight:600; letter-spacing:.22em;
    text-transform:uppercase; color:var(--accent); animation:blink 1.2s steps(2) infinite; }
  @keyframes blink{50%{opacity:.2}}
  @media (prefers-reduced-motion:reduce){ .coin{animation:none} }

  .grid{
    display:grid; gap:22px; max-width:1080px; margin:14px auto 70px; padding:0 20px;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  }
  .cab{
    position:relative; cursor:pointer; text-align:left; color:inherit; text-decoration:none;
    background:var(--card); border:1px solid #34383f; border-radius:10px; overflow:hidden;
    transition:transform .12s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .cab:hover,.cab:focus-visible{
    transform:translateY(-4px); outline:none; border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent), 0 14px 34px -18px #000;
  }
  .marquee{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 13px; font-size:10px; font-weight:700; letter-spacing:.12em; color:#20232a;
    background:var(--accent); text-transform:uppercase;
  }
  .marquee .yr{opacity:.8}
  .screen{
    height:150px; display:flex; align-items:center; justify-content:center; padding:16px; text-align:center;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 3px, rgba(0,0,0,.22) 3px 4px),
      linear-gradient(160deg, #2f3944 0%, #1c1f25 75%);
  }
  .screen .name{ font-family:var(--disp); font-weight:800; text-transform:uppercase;
    font-size:clamp(17px,2.6vw,24px); color:#fff; letter-spacing:.01em; line-height:1.1; }
  .foot{ display:flex; justify-content:space-between; align-items:center; padding:12px 13px; font-size:12px; color:var(--dim); }
  .go{ color:var(--accent); font-weight:600; letter-spacing:.04em }

  /* Player view */
  #player{ position:fixed; inset:0; z-index:60; background:#000; display:none; }
  #dos{ width:100%; height:100%; }
  #back{
    position:fixed; top:14px; left:14px; z-index:62; cursor:pointer;
    font-family:var(--body); font-weight:600; font-size:12px; letter-spacing:.06em;
    color:#20232a; background:var(--accent); border:none; border-radius:6px; padding:10px 15px;
  }
  #back:hover{ filter:brightness(1.1) }
  #hint{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:62;
    font-family:var(--body); font-size:11px; letter-spacing:.03em; line-height:1.6; text-align:center;
    color:var(--fg); background:rgba(40,40,40,.9); border:1px solid #465c69;
    border-radius:8px; padding:8px 13px; max-width:92vw;
  }
  footer{ text-align:center; color:var(--dim); font-size:11px; padding:0 0 40px; letter-spacing:.08em; }
</style>
</head>
<body class="crt">
  <div id="menu">
    <header>
      <h1>LANMINE <span class="b">ARCADE</span></h1>
      <div class="coin">Select a game</div>
    </header>
    <main class="grid" id="grid"></main>
    <footer>Powered by js-dos · add a game via pull request</footer>
  </div>

  <div id="player">
    <button id="back">&#9664; Arcade</button>
    <div id="dos"></div>
    <div id="hint">Ctrl · Alt · Esc need fullscreen — tap &#9042; in the game bar, then click the game</div>
  </div>

<script>
  const GAMES = [
    { title:'Commander Keen', name:'Marooned on Mars', tag:'Platformer', year:'1990', url:'games/keen1.jsdos' },
    { title:'Digger',         name:'Digger',           tag:'Arcade',     year:'1983', url:'games/digger.jsdos' },
    { title:'DOOM',           name:'Knee-Deep in the Dead', tag:'FPS',   year:'1993', href:'https://doom.tech.lanmine.no' },
  ];

  const grid = document.getElementById('grid');
  for (const g of GAMES) {
    const el = document.createElement(g.href ? 'a' : 'button');
    el.className = 'cab';
    if (g.href) { el.href = g.href; }
    el.innerHTML =
      '<div class="marquee"><span>' + g.tag + '</span><span class="yr">' + g.year + '</span></div>' +
      '<div class="screen"><div class="name">' + g.title + '</div></div>' +
      '<div class="foot"><span>' + g.name + '</span><span class="go">' + (g.href ? 'LAUNCH ↗' : 'PLAY ▶') + '</span></div>';
    if (!g.href) el.addEventListener('click', () => play(g));
    grid.appendChild(el);
  }

  function play(g) {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('player').style.display = 'block';
    // No kiosk: keep the js-dos toolbar so its fullscreen button is available.
    // Ctrl/Alt/Esc only reach the game under js-dos fullscreen (Keyboard Lock API).
    Dos(document.getElementById('dos'), { url: g.url, autoStart: true });
  }
  document.getElementById('back').addEventListener('click', () => location.reload());
</script>
</body>
</html>
