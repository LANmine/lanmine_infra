# Gatus monitoring configuration — this file IS the monitor list.
# Add a service by copying an "- name:" block below and opening a Pull Request.
# Full reference: https://github.com/TwiN/gatus

web:
  port: 8080

endpoints:
  # --- Infrastructure -------------------------------------------------------
  - name: portainer
    group: infra
    url: "https://portainer.ragnarok.eslg.no/api/status"
    interval: 60s
    client:
      insecure: true          # the server uses a self-signed certificate
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"

  # --- Services -------------------------------------------------------------
  - name: example
    group: services
    url: "https://example.tech.lanmine.no"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  - name: it-tools
    group: services
    url: "https://tools.tech.lanmine.no"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

# --- How to add alerting (optional) -----------------------------------------
# Uncomment and fill in to get notified. Put webhook URLs in a GitHub secret and
# reference them here as ${DISCORD_WEBHOOK_URL} — never paste a real URL in this file.
#
# alerting:
#   discord:
#     webhook-url: "${DISCORD_WEBHOOK_URL}"
#
# Then add to any endpoint:
#   alerts:
#     - type: discord
#       failure-threshold: 3
#       send-on-resolved: true
