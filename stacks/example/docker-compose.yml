services:
  # Landing page = a full-screen looping NETPANDAS video. Bind mounts are disabled,
  # so this init container clears the old (untracked) volume content and pulls the
  # page + video from the repo into the htdocs volume before Apache starts.
  content-loader:
    image: curlimages/curl:latest
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rm -rf /usr/local/apache2/htdocs/* 2>/dev/null || true
        curl -sSf -H 'Accept: application/vnd.github.raw' 'https://api.github.com/repos/LANmine/lanmine_infra/contents/stacks/example/index.html?ref=main' -o /usr/local/apache2/htdocs/index.html
        curl -sSf -H 'Accept: application/vnd.github.raw' 'https://api.github.com/repos/LANmine/lanmine_infra/contents/stacks/example/NETPANDAS.mp4?ref=main' -o /usr/local/apache2/htdocs/NETPANDAS.mp4
    volumes:
      - htdocs:/usr/local/apache2/htdocs

  web:
    image: httpd:latest
    restart: unless-stopped
    depends_on:
      content-loader:
        condition: service_completed_successfully
    volumes:
      - htdocs:/usr/local/apache2/htdocs
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.example.rule=Host(`example.tech.lanmine.no`)
      - traefik.http.routers.example.service=example
      - traefik.http.services.example.loadbalancer.server.port=80

volumes:
  htdocs:

networks:
  traefik:
    external: true
