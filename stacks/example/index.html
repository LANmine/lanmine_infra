<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NETPANDAS</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: pointer; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #snd {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 2;
    font-family: ui-monospace, "Courier New", monospace; font-size: 12px; letter-spacing: 0.16em;
    text-transform: uppercase; color: #fff; background: rgba(0,0,0,0.45);
    padding: 8px 14px; border-radius: 4px; transition: opacity 0.5s ease;
  }
</style>
</head>
<body>
  <video id="v" src="NETPANDAS.mp4" autoplay muted loop playsinline></video>
  <div id="snd">🔊 Click for sound</div>
  <script>
    var v = document.getElementById('v'), s = document.getElementById('snd');
    v.play().catch(function(){});                 // ensure muted autoplay starts
    document.body.addEventListener('click', function () {
      v.muted = !v.muted;
      s.style.opacity = v.muted ? '1' : '0';
      if (!v.muted) v.play().catch(function(){});
    });
  </script>
</body>
</html>
