---
# Device inventory. mgmt IPs live on the management VLAN; the self-hosted runner
# reaches them over that VLAN. Credentials come from env (Actions secrets), never here.
#
# Real devices today:
#   oob     — ISR 1111, year-round OOB management router (VLAN 10, 10.0.10.0/24)
#   gw      — gw1 (WS-C3650-48FQM), primary production gateway (VLAN 20, 10.0.20.0/24)
#
# LAN event topology (LM42 / future) uses placeholder IPs until ISP handoff.
all:
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: "{{ lookup('env', 'NET_USER') }}"
    ansible_password: "{{ lookup('env', 'NET_PASSWORD') }}"
    snmp_community: "{{ lookup('env', 'NET_SNMP_COMMUNITY') | default('', true) }}"
  children:

    # ── Real year-round devices ───────────────────────────────────────────────

    oob:
      vars:
        ansible_network_os: cisco.ios.ios
      hosts:
        isr1111:
          ansible_host: 10.0.10.1

    gw:
      vars:
        ansible_network_os: cisco.ios.ios
      hosts:
        gw1:
          ansible_host: 10.0.20.2   # Gi0/0 Mgmt-vrf (WS-C3650-48FQM)
          hsrp_priority: 110        # primary — holds the ISP SFP
        gw2:
          ansible_host: 10.0.0.3    # TODO: real Mgmt-vrf IP
          hsrp_priority: 90         # standby

    # ── LAN event topology (LM42 / future) ───────────────────────────────────

    core:
      vars:
        ansible_network_os: cisco.nxos.nxos
      hosts:
        core1: {ansible_host: 10.0.0.4}
        core2: {ansible_host: 10.0.0.5}

    edge:
      vars:
        ansible_network_os: cisco.ios.ios
      hosts:
        edge01: {ansible_host: 10.0.0.11}
        edge02: {ansible_host: 10.0.0.12}
