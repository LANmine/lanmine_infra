---
# Settings shared by every device.
domain_name: lan.lanmine.no

# NTP default — overridden in group_vars/oob.yaml and sw_mgmt.yaml because
# the production mgmt VLAN (10.0.0.x) is not reachable from those segments.
ntp_servers:
  - 10.0.0.1      # TODO: replace with real production mgmt server once it exists
dns_servers:
  - 10.0.0.1

# ── LAN event VLANs (production fabric: gw / core / edge) ───────────────────
# These are the participant and service VLANs carried across the event fabric.
# Addressing below is the intended design for LM42; update once ISP allocations
# are confirmed and recorded in NetBox.
#
#   VLAN 10 — participants: receives the ISP /24 directly, no NAT.
#   VLAN 20 — AP management: NATted behind ISR LTE (private, no public IP).
#   VLAN 30 — infra/staff: restricted, no participant access.
#   VLAN 100 — production management: gateway/core/edge management SVI.
vlans:
  10: participants
  20: ap-management
  30: infra

# Management subnet. There is deliberately no global mgmt_vlan: gateways are
# managed OOB on a routed port in Mgmt-vrf, and switch management rides the OOB
# router's VLAN 20. mgmt_vlan is per-host for switch SVIs (edge.j2).
mgmt_subnet: 10.0.20.0/24  # OOB router VLAN 20 (sw-mgmt); gw1 Gi0/0 = .2

banner: |
  LANmine network device - managed by GitOps (github.com/LANmine/lanmine_infra).
  Do not configure by hand; changes are overwritten. Authorised access only.
