---
# Settings shared by every device.
domain_name: lan.lanmine.no

# NTP default — overridden in group_vars/oob.yaml because the OOB segment is
# off the production fabric and cannot reach the prod NTP.
ntp_servers:
  - 10.0.0.1      # TODO: replace with real production mgmt server once it exists
dns_servers:
  - 10.0.0.1

# ── LAN event VLAN (production fabric: gw / core / edge) ────────────────────
# Single participant VLAN carried across the event fabric. It is the public
# /24 the ISP routes to us (static route to gw1) — participants get real public
# IPs, no NAT. 192.0.2.0/24 is a placeholder (TEST-NET-1); swap in the real ISP
# allocation once confirmed and record it in NetBox.
vlans:
  1337: participants

# Management subnet. There is deliberately no global mgmt_vlan: gateways are
# managed OOB on a routed port in Mgmt-vrf, and switch management rides the OOB
# router's VLAN 20. mgmt_vlan is per-host for switch SVIs (edge.j2).
mgmt_subnet: 10.0.20.0/24  # OOB router VLAN 20 (gw-mgmt); gw1 Gi0/0 = .2

banner: |
  LANmine network device - managed by GitOps (github.com/LANmine/lanmine_infra).
  Do not configure by hand; changes are overwritten. Authorised access only.
