---
# Settings shared by every device.
domain_name: lan.lanmine.no

# NTP default — overridden in group_vars/oob.yaml because the OOB segment is
# off the production fabric and cannot reach the prod NTP.
ntp_servers:
  - 10.0.0.1      # TODO: replace with real production mgmt server once it exists
dns_servers:
  - 10.0.0.1

# ── LAN event VLANs (production fabric: gw / core / edge) ───────────────────
# 50 legacy-mgmt — the management segment baked into the reused old switches:
# 172.16.1.0/25 (e.g. CORE-SW-01's Vlan50 SVI = 172.16.1.11/25, gw 172.16.1.1).
# Deliberate carve-out so that gear comes up reachable the moment it is trunked
# in, with no factory reset. NOTE: breaks the "third octet = VLAN" convention on
# purpose — it matches the existing gear's address space, not the fabric. It is a
# bridge, not a home: renumber reused switches onto VLAN 200 (10.200.0.x) as they
# are onboarded.
# 100 participants — the contestant network, and it is the PUBLIC /24 the ISP
# (BLIX) statically routes to gw1. Placeholder 192.0.2.0/24 (TEST-NET-1) until
# the real block is assigned; participant_subnet in gw.yaml is the single swap
# point. It deliberately reuses VLAN 100 because the reused old switches (core +
# edges) already run contestant-facing access ports on VLAN 100 «CONTESTANTS» —
# they carry participants as-is, no retagging. Participants lease real public
# IPs from a DHCP pool on gw1 (gateway-only; excludes the HSRP virtual/gateway
# addresses and the WiFi-NAT pair). The «no VLAN 100» rule is ISR-scoped: the
# OOB router never carries it (isr1111.j2 unchanged) — on the fabric, VLAN 100
# is the primary participant net. VLAN 50 (legacy-mgmt) remains the management
# carve for reused gear.
# 200 mgmt — private in-band management for the fabric switches (core/edge SVI
# addresses). No internet egress.
# 201 servers — private operations network: the in-band Ansible runner machine
# (gets its network from gw1/gw2) + any event ops hosts. NAT'd out via the
# transit for internet (GitHub) — see gw.j2.
# 202 ap-mgmt — AP management plane; APs are static 10.202.0.2-20. Sealed like
# the switch mgmt plane (only the servers net may SSH/ICMP in, no egress).
# WiFi client traffic is NOT here — the AP trunks it tagged on VLAN 210
# (FlexConnect local switching).
# 210 wifi — guest WiFi clients, DHCP from gw1 (10.210.0.100-254). RFC1918 and
# the fabric/OOB nets are blocked by WIFI-INGRESS; outbound NAT rides the
# participant block (192.0.2.10-11) so WiFi never spends participant public IPs.
vlans:
  50: legacy-mgmt
  100: participants
  200: mgmt
  201: servers
  202: ap-mgmt
  210: wifi

# Fabric management networks, routed by gw1/gw2 (HSRP). VLAN 200 = switch
# management; VLAN 201 = servers/operations (the in-band runner reaches the
# switch SVIs on 200 over L3 through the gateways); VLAN 202 = AP management
# (static APs); VLAN 210 = guest WiFi (DHCP, NAT'd). The gateways' *own*
# management stays OOB (Gi0/0 in Mgmt-vrf) — never routed on these SVIs.
fabric_mgmt_subnet: 10.200.0.0/24
fabric_servers_subnet: 10.201.0.0/24
fabric_ap_mgmt_subnet: 10.202.0.0/24
fabric_wifi_subnet: 10.210.0.0/24

# Legacy management segment (VLAN 50) — the baked-in mgmt net of the reused old
# switches. Routed only by the gateways (SVI 172.16.1.1/25); new core/edge just
# trunk it. Sealed like the fabric mgmt plane: only the servers net may SSH/ICMP
# in. Transitional — reused gear moves onto 10.200.0.x as it is onboarded.
legacy_mgmt_subnet: 172.16.1.0/25
mgmt_vlan: 200
servers_vlan: 201
ap_mgmt_vlan: 202
wifi_vlan: 210

# Gateway OOB management subnet (Mgmt-vrf Gi0/0 → OOB router VLAN 20 gw-mgmt).
# This is distinct from the fabric mgmt VLAN above.
mgmt_subnet: 10.0.20.0/24  # OOB router VLAN 20 (gw-mgmt); gw1 Gi0/0 = .2

banner: |
  LANmine network device - managed by GitOps (github.com/LANmine/lanmine_infra).
  Do not configure by hand; changes are overwritten. Authorised access only.
