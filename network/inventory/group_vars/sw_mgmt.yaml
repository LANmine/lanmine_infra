---
# Management switches — currently just sw01 (WS-C3650-48FQM).
# Reachable via Mgmt-vrf on VLAN 20 (10.0.20.0/24, no internet).
role: sw-mgmt
template_name: sw-mgmt

# Default gateway for Mgmt-vrf — ISR 1111 Vlan20 SVI.
mgmt_gateway: 10.0.20.1

# NTP via ISR (10.0.20.1) or public over ISR if the ISR forwards it.
# Using public for simplicity since ISR has LTE internet on VLAN 10.
ntp_servers:
  - pool.ntp.org
