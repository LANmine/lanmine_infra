---
# gw1/gw2 — production edge gateways (Cisco IOS-XE Catalyst 9300). First-hop
# redundancy via HSRP. gw1 is primary (holds the ISP SFP on its 10G uplink),
# gw2 is warm standby. Uplink addressing is per-device in host_vars/gw1.yaml
# (and host_vars/gw2.yaml once it gets specifics).
role: gw
# Ansible uses enable secret for privilege escalation on IOS.
ansible_become: true
ansible_become_method: enable
ansible_become_password: "{{ lookup('env', 'NET_PASSWORD') }}"

# Placeholder upstream/mgmt defaults shared by both gateways; the real values
# belong to gw1's ISP handoff and go in host_vars/gw1.yaml (TODO).
isp_address: 203.0.113.2/30
isp_gateway: 203.0.113.1
mgmt_ip: 10.0.20.2   # OOB router VLAN 20 (gw-mgmt); real value per host in host_vars
# Participant public /24 — the block the ISP statically routes to gw1. Placeholder
# 192.0.2.0/24 (TEST-NET-1). This is the single swap point for the real ISP
# allocation; it feeds the PARTICIPANT-INGRESS ACL in gw.j2. Participants use
# static public IPs (DHCP reservations are not possible logistically), so the
# mask is assumed /24 today — parameterize it when the real block lands.
participant_subnet: 192.0.2.0/24
# Interface names vary by hardware — override in host_vars.
isp_interface: TenGigabitEthernet1/1/1
core1_interface: TenGigabitEthernet1/1/2
core2_interface: TenGigabitEthernet1/1/3

# Uplinks to the core switches carry the single participant VLAN as a trunk.
core_uplink_allowed_vlans: "1337"

# HSRP virtual gateway the participants use (one per routed VLAN — the single
# participant VLAN 1337). Gateway management is OOB-only (Gi0/0 Mgmt-vrf),
# never routed as an SVI — there is deliberately no VLAN 20 here.
# Group number = VLAN id; each box derives its real SVI address from the
# virtual IP (gw1 = .2, gw2 = .3). TODO: confirm against NetBox.
hsrp_groups:
  - {vlan: 1337, virtual_ip: 192.0.2.1}   # participants — placeholder public /24
