---
# gw1/gw2 — production edge gateways (Cisco IOS-XE Catalyst 9300). First-hop
# redundancy via HSRP. gw1 is primary (holds the ISP SFP on its 10G uplink),
# gw2 is warm standby. Uplink addressing is per-device in host_vars/gw1.yaml
# (and host_vars/gw2.yaml once it gets specifics).
role: gw
# Ansible uses enable secret for privilege escalation on IOS.
ansible_become: true
ansible_become_method: enable
ansible_become_password: "{{ lookup('env', 'NET_PASSWORD') }}"

# Placeholder upstream/mgmt defaults shared by both gateways; the real values
# belong to gw1's ISP handoff and go in host_vars/gw1.yaml (TODO).
isp_address: 203.0.113.2/30
isp_gateway: 203.0.113.1
mgmt_ip: 10.0.20.2   # OOB router VLAN 20 (gw-mgmt); real value per host in host_vars
# Participant public /24 — the block BLIX statically routes to gw1 (temporary
# event allocation for HvalerLAN). This is the single swap point: it feeds the
# PARTICIPANT-INGRESS ACL, the participant DHCP pool and the WiFi-NAT pool
# addresses in gw.j2, so a swap touches nothing else. The mask is assumed /24
# today — parameterize when the real block's mask differs.
participant_subnet: 185.12.58.0/24
# DNS handed to participants on the public VLAN 100. BLIX's gateway
# (91.205.184.253) is the event default: participants ride the real BLIX /24, so
# the ISP's own resolver avoids third-party hops.
# 1.1.1.1 benchmarked at 2ms from gw1's ISP interface (faster than BLIX gateway
# 91.205.184.253 which pings fine but does not answer DNS queries).
participant_dns: 1.1.1.1 8.8.8.8
# DNS for guest WiFi clients. Kept separate: WiFi egress is NAT'd off the
# participant block, so it keeps a generic public resolver.
wifi_dns: 1.1.1.1
# Interface names vary by hardware — override in host_vars.
isp_interface: TenGigabitEthernet1/1/1
core1_interface: TenGigabitEthernet1/1/2
core2_interface: TenGigabitEthernet1/1/3

# Uplinks to the core switches carry the fabric VLANs as a trunk. Incremental
# event bring-up (2026-09-29): only legacy-mgmt (VLAN 50) + participant
# (VLAN 100) ride the trunks today — the fabric VLANs 200/201/202/210 stay OFF
# the cores until the core rebuild lands; re-extend this list then. The servers
# VLAN is gateway-local: only the in-band runner plugs into it (a gateway access
# port), so it never rides the uplinks.
core_uplink_allowed_vlans: "50,100"

# Access ports that host the in-band operations machines (the Ansible runner
# machine + spares), on the servers VLAN.
server_access_ports: "GigabitEthernet1/0/45 - 48"

# HSRP virtual gateways — one per routed VLAN. The role field selects the role the
# gw.j2 SVI loop special-cases: participant = uRPF + PARTICIPANT-INGRESS,
# mgmt/legacy_mgmt/ap_mgmt = sealed MGMT-INGRESS, servers = NAT inside, wifi =
# WIFI-INGRESS + NAT inside. Group number = VLAN id; each box derives its real SVI
# address from the virtual IP (gw1 = .2, gw2 = .3). A non-/24 segment sets its own
# `mask` (VLAN 50 is /25).
# The gateways' *own* management is OOB-only (Gi0/0 Mgmt-vrf) — never routed as
# an SVI — while the fabric's switch-mgmt, servers, ap-mgmt, wifi and the legacy
# management nets ARE the in-band SVIs below. TODO: confirm against NetBox.
hsrp_groups:
  - {vlan: 50,  virtual_ip: 172.16.1.1,  role: legacy_mgmt, mask: 255.255.255.128}   # reused old switches' baked-in mgmt (172.16.1.0/25)
  - {vlan: 100, virtual_ip: 185.12.58.1, role: participant}                            # contestant/public /24 — BLIX 185.12.58.0/24; DHCP from gw1
# Deferred until fabric is ready:
#  - {vlan: 200, virtual_ip: 10.200.0.1, role: mgmt}          # fabric switch management
#  - {vlan: 201, virtual_ip: 10.201.0.1, role: servers}       # operations / in-band runner
#  - {vlan: 202, virtual_ip: 10.202.0.1, role: ap_mgmt}       # AP management (static APs)
#  - {vlan: 210, virtual_ip: 10.210.0.1, role: wifi}          # guest WiFi (DHCP, NAT)
