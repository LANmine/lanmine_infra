---
# edge01..edgeNN — participant access switches.
role: edge
uplink_interface: GigabitEthernet1/0/48     # trunk up to a core switch
access_ports: "GigabitEthernet1/0/1 - 47"   # participant ports
access_vlan: 100                           # participant VLAN — reused old switches' contestant ports already run VLAN 100 as-is
uplink_allowed_vlans: "50,100,200,202,210"    # legacy-mgmt + participant + mgmt + ap-mgmt + wifi
# AP ports: set per-host once the real edge hardware is known, e.g.
#   ap_ports: "GigabitEthernet1/0/45 - 48"   # FlexConnect trunk (native 202, tagged 210)
# This renders the AP trunk block in edge.j2; without it the switch has no AP ports.
