---
# gw1 — Cisco Catalyst C9300-48P (primary production edge gateway).
# SN: FOC2615YDG9, IOS-XE 17.5.1, network-advantage + dna-advantage licence.
# Console: ACM port1 (SSH 3001, ogconsole 1), 9600 8N1.
# Management: GigabitEthernet0/0 in Mgmt-vrf — Ansible reach path.
#
# Hardware:
#   48x GigabitEthernet1/0/1-48  (1G copper, participant access)
#   12x TenGigabitEthernet1/1/1-12 (10G SFP+, ISP uplink + core uplinks)
#    4x FortyGigabitEthernet  (uplink module slots, model dependent)
#
# Dedicated GigabitEthernet0/0 in Mgmt-vrf (out-of-band, separate from data plane).
# NAT available with network-advantage licence.
# BGP available.
#
mgmt_ip: 10.0.20.2        # GigabitEthernet0/0 in Mgmt-vrf

# ISP uplink — TenGigabitEthernet1/1/1: the BLIX transit linknet 91.205.184.252/30.
# gw1 owns .254; BLIX's router is .253. Participant block: 185.12.58.0/24 (BLIX,
# temporary HvalerLAN allocation) — participant_subnet in group_vars/gw.yaml is the
# single swap point. The 2026-02-05 linknet is from the HvalerLan circuit.
# FortyGigabitEthernet1/1/1 is present but unused.
isp_interface: TenGigabitEthernet1/1/1
isp_address: 91.205.184.254/30
isp_gateway: 91.205.184.253

# Core uplink interfaces (trunk to core1/core2).
core1_interface: TenGigabitEthernet1/1/2
core2_interface: TenGigabitEthernet1/1/3

# Additional uplink ports ready for extra core/switch connections.
# All configured as trunks carrying the same VLAN list as the primary core links.
# Fo1/1/1 is labelled uplink-isp but is NOT the ISP port (Te1/1/1 is) — repurposed.
# Tw1/1/2 is unconfigured on the device; this brings it in line with the others.
extra_trunk_interfaces:
  - {iface: FortyGigabitEthernet1/1/1, description: spare-trunk-1}
  - {iface: FortyGigabitEthernet1/1/2, description: spare-trunk-2}
  - {iface: TwentyFiveGigE1/1/1,       description: spare-trunk-3}
  - {iface: TwentyFiveGigE1/1/2,       description: spare-trunk-4}

# DHCP server for the participant (VLAN 100 — the public contestant net) and
# WiFi (210) segments. gw1 only by design: pools live in gw.j2 behind this flag,
# so gw2 renders no pools (if gw1 is down, existing leases continue via HSRP
# failover but no new leases are issued — acceptable for an event network).
dhcp_server: true

# AP host ports — FlexConnect trunks (native ap-mgmt VLAN 202, tagged wifi 210).
# Ports are free/unused on gw1 (no cable = inert config). This is the LM42 path
# until a fabric edge is deployed that should host the APs instead.
gw_ap_ports: "GigabitEthernet1/0/41 - 42"

# Participant test access ports — direct 1G copper to the participant VLAN 100
# (the public contestant net), used as the LM42 pre-event DHCP+uRPF test path.
# Port-security is non-sticky (violation restrict) so test MACs don't pin; same
# untrusted-edge doctrine as the server ports. These are gw1-only, not on gw2.
gw_participant_ports: "GigabitEthernet1/0/1 - 2"
