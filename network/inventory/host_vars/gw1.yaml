---
# gw1 — Cisco Catalyst C9300-48P (primary production edge gateway).
# SN: FOC2615YDG9, IOS-XE 17.5.1, network-advantage + dna-advantage licence.
# Console: ACM port1 (SSH 3001, ogconsole 1), 9600 8N1.
# Management: GigabitEthernet0/0 in Mgmt-vrf — Ansible reach path.
#
# Hardware:
#   48x GigabitEthernet1/0/1-48  (1G copper, participant access)
#   12x TenGigabitEthernet1/1/1-12 (10G SFP+, ISP uplink + core uplinks)
#    4x FortyGigabitEthernet  (uplink module slots, model dependent)
#
# Dedicated GigabitEthernet0/0 in Mgmt-vrf (out-of-band, separate from data plane).
# NAT available with network-advantage licence.
# BGP available.
#
mgmt_ip: 10.0.20.2        # GigabitEthernet0/0 in Mgmt-vrf

# ISP uplink — verified on device: TenGigabitEthernet1/1/1 already has 203.0.113.2/30.
# FortyGigabitEthernet1/1/1 is present but unused.
# TODO: replace ISP address with real linknett /30 once ISP hands off for LM42.
isp_interface: TenGigabitEthernet1/1/1
isp_address: 203.0.113.2/30
isp_gateway: 203.0.113.1

# Core uplink interfaces (trunk to core1/core2).
core1_interface: FortyGigabitEthernet1/1/2
core2_interface: TwentyFiveGigE1/1/1

# DHCP server for the participant (1337) and WiFi (210) segments. gw1 only by
# design: pools live in gw.j2 behind this flag, so gw2 renders no pools (if gw1
# is down, existing leases continue via HSRP failover but no new leases are
# issued — acceptable for an event network).
dhcp_server: true

# AP host ports — FlexConnect trunks (native ap-mgmt VLAN 202, tagged wifi 210).
# Ports are free/unused on gw1 (no cable = inert config). This is the LM42 path
# until a fabric edge is deployed that should host the APs instead.
gw_ap_ports: "GigabitEthernet1/0/41 - 42"
