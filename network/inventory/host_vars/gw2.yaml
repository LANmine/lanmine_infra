---
# gw2 — Cisco Catalyst C9300-48P (warm-standby edge gateway).
# SN: FOC2615YDEC, IOS-XE 17.3.5. Used UiO box, factory-reset clean 2026-09-27.
# Console: ACM port2 (SSH 3002, ogconsole 2), 9600 8N1.
# Management: GigabitEthernet0/0 in Mgmt-vrf — Ansible reach path.
#
# Hardware (verified on device 2026-09-27):
#   48x GigabitEthernet1/0/1-48  (1G copper, participant access)
#    8x TenGigabitEthernet1/1/1-8 (10G SFP+, ISP + core uplinks)
#    2x FortyGigabitEthernet1/1/1-2
#    2x TwentyFiveGigE1/1/1-2
#    4x GigabitEthernet1/1/1-4 (unused/down)
#   Ap1/0/1 internal AP port (present on all Catalyst 9300s).
#
# HSRP: hsrp_priority: 90 (standby) lives in hosts.yaml. SVI addresses derive
# from each group's virtual IP (.1 -> .3) in gw.j2 by this hostname, so no
# per-SVI address is needed here.
#
mgmt_ip: 10.0.20.3        # GigabitEthernet0/0 in Mgmt-vrf

# ISP uplink — warm standby: no SFP fitted as of 2026-09-27, Te1/1/1 is the
# intended slot (mirrors gw1). The /30 is a *distinct* placeholder from gw1's
# 203.0.113.2/30 so the two gateways can never render a duplicate address on the
# same segment; reconcile with the real linknett allocation at ISP handoff.
isp_interface: TenGigabitEthernet1/1/1
isp_address: 203.0.113.6/30
isp_gateway: 203.0.113.5

# Core uplink interfaces (trunk to core1/core2). Placeholders — uplinks not
# cabled as of 2026-09-27; set to the physically-wired ports when run.
# Note the model quirk: the 25G port shows as TwentyFiveGigE (abbrev "Twe" in
# show output).
core1_interface: FortyGigabitEthernet1/1/1
core2_interface: TwentyFiveGigE1/1/1
