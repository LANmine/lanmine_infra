---
# Render intended configs from templates + vars into intended/.
# Runs entirely locally (connection: local) — no device access, no secrets needed,
# so it is safe to run on the hosted runner for PR validation.
- name: Render intended configs
  hosts: all
  gather_facts: false
  connection: local
  tasks:
    - name: Render {{ inventory_hostname }}
      ansible.builtin.template:
        # Default is role-based (gw.j2, core.j2, edge.j2); a device can point at
        # a different template with a `template_name` var (e.g. oob -> isr1111.j2).
        src: "{{ playbook_dir }}/../templates/{{ template_name | default(role) }}.j2"
        dest: "{{ playbook_dir }}/../intended/{{ inventory_hostname }}.cfg"
        mode: "0644"
