name: Deploy network configs

# Applies configs to the real switches from the on-site self-hosted runner
# (label: lanmine-net), which reaches them over the management VLAN.
#
# Currently workflow_dispatch only. Once the self-hosted runner is registered,
# uncomment the push trigger so a merge to main auto-deploys the changed configs.
#
# `scope` selects the `--limit` for the deploy:
#   oob,gw1   (default) — the real, always-on OOB lane, as before.
#   core,edge            — event fabric switches, deployed from the in-band
#                          runner once it is registered (label lanmine-net).
#   all                  — everything (requires the fabric runner to have
#                          routes to the real devices).
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Hosts to deploy (--limit expression).'
        type: choice
        required: true
        default: 'oob,gw1'
        options:
          - 'oob,gw1'
          - 'core,edge'
          - 'all'
  # push:
  #   branches: [main]
  #   paths:
  #     - 'network/**'

permissions:
  contents: read

concurrency:
  group: net-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, lanmine-net]
    defaults:
      run:
        working-directory: network
    env:
      NET_USER: ${{ secrets.NET_USER }}
      NET_PASSWORD: ${{ secrets.NET_PASSWORD }}
      NET_SNMP_COMMUNITY: ${{ secrets.NET_SNMP_COMMUNITY }}
      PATH: /home/placeholder/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install tooling
        run: ansible --version | head -1

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Render intended configs
        run: ansible-playbook playbooks/render.yml

      - name: Dry-run (diff only, no changes)
        run: ansible-playbook playbooks/deploy.yml --check --diff --limit ${{ inputs.scope }}

      - name: Apply
        run: ansible-playbook playbooks/deploy.yml --limit ${{ inputs.scope }}
