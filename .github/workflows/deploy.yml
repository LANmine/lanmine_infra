name: Deploy to server

# Runs when a change to a stack lands on the main branch (i.e. after a PR is merged).
# It works out which stacks changed and tells Portainer to deploy just those.
on:
  push:
    branches: [main]
    paths:
      - 'stacks/**'

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

# Prevent two deploys from running at the same time.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # we need history to see what changed

      - name: Work out which stacks changed
        id: changed
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            # First push / unknown base: consider all stacks.
            files=$(git ls-files 'stacks/')
          else
            # Any changed file inside a stack folder (compose, config.yaml, etc.).
            files=$(git diff --name-only "$before" '${{ github.sha }}' -- 'stacks/')
          fi
          names=$(printf '%s\n' "$files" | awk -F/ 'NF>=3 && $1=="stacks" {print $2}' | sort -u | tr '\n' ' ')
          echo "Changed stacks: $names"
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Deploy changed stacks to Portainer
        if: steps.changed.outputs.names != ''
        env:
          PORTAINER_URL: https://portainer.ragnarok.eslg.no
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: '7'
          REPO_URL: https://github.com/LANmine/lanmine_infra
          GIT_REF: refs/heads/main
          # The secrets a stack may reference, listed one by one. toJSON(secrets)
          # would hand the runner every repo and org secret instead, including
          # ones no stack needs (CodeQL: actions/excessive-secrets-exposure).
          # Adding a secret means a line here and a name in INJECTABLE in
          # scripts/deploy_stacks.py.
          OPENWEBUI_BLIX_KEY: ${{ secrets.OPENWEBUI_BLIX_KEY }}
          OWUI_EMAIL: ${{ secrets.OWUI_EMAIL }}
          OWUI_PASSWORD: ${{ secrets.OWUI_PASSWORD }}
          NETBOX_SECRET_KEY: ${{ secrets.NETBOX_SECRET_KEY }}
          NETBOX_DB_PASSWORD: ${{ secrets.NETBOX_DB_PASSWORD }}
          NETBOX_SUPERUSER_PASSWORD: ${{ secrets.NETBOX_SUPERUSER_PASSWORD }}
          STACK_NAMES: ${{ steps.changed.outputs.names }}
        run: |
          # Names come from folder names in the repo — validate before use so a
          # crafted path can't inject shell commands into the runner.
          for n in $STACK_NAMES; do
            printf '%s' "$n" | grep -qE '^[a-z0-9][a-z0-9._-]*$' \
              || { echo "Refusing unsafe stack name: $n"; exit 1; }
          done
          python3 scripts/deploy_stacks.py $STACK_NAMES
